# application.properties (optional default fallback)
spring.application.name=backend
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/Travel_Bucket}
spring.data.mongodb.database=Travel_Bucket

# Helpful during development/debugging (add ?trace=true to see stacktrace)
server.error.include-message=always
server.error.include-stacktrace=on_param
